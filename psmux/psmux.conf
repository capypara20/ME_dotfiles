# ============================================
# 設定が読み込まれているか確認するための psmux.conf
# ============================================

# ステータスバーを青地に白文字にする
# (デフォルトは緑地に黒文字なので、青ければ設定が効いている証拠)
set -g status-style "bg=blue,fg=white"

# ステータスバーの左側に目印を表示する
set -g status-left "[設定OK! #S] "

# 左側表示の長さ制限をゆるめる(デフォルト10文字だと目印が切れるため)
set -g status-left-length 30
